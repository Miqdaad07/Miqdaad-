<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Preconnect to Google Fonts to speed up mobile rendering -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Primary SEO Metadata -->
    <title>Miqdaad Labs | Premium Web Development & Digital Solutions</title>
    <meta name="title" content="Miqdaad Labs | Premium Web Development & Digital Solutions" />
    <meta name="description" content="Miqdaad Labs builds modern, responsive, and conversion-focused websites for businesses, brands, and organizations worldwide." />
    <meta name="author" content="Miqdaad Labs" />
    <meta name="robots" content="index, follow" />
    <meta name="keywords" content="web development agency, custom websites, premium design, web apps, react web design, high performance, e-commerce, digital solutions" />

    <!-- Favicon & Icon Support -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    
    <!-- Open Graph / Meta Properties for Facebook, LinkedIn, WhatsApp & general sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Miqdaad Labs — Modern Web Development Agency" />
    <meta property="og:description" content="Premium web development solutions including business websites, landing pages, web applications, and modern digital experiences." />
    <meta property="og:image" content="/images/og_image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />

    <!-- Twitter / X Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Miqdaad Labs" />
    <meta name="twitter:description" content="Premium web development solutions including business websites, landing pages, web applications, and modern digital experiences." />
    <meta name="twitter:image" content="/images/og_image.png" />
    
    <!-- Additional optimizations for WhatsApp / rich embed formatting -->
    <meta itemprop="name" content="Miqdaad Labs" />
    <meta itemprop="description" content="Miqdaad Labs builds modern, responsive, and conversion-focused websites for businesses, brands, and organizations worldwide." />
    <meta itemprop="image" content="/images/og_image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
